<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - UTOME</title>
    <meta name="description"
        content="Crie sua conta no UTOME e comece a gerenciar as rotinas do seu filho com tecnologia que acolhe.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #F57C00;
            --primary-dark: #D06900;
            --secondary: #E6CDAA;
            --dark: #4A1F14;
            --text-light: #8B6B63;
            --border: #EAEAEA;
            --white: #FFFFFF;
            --font: 'Nunito', system-ui, sans-serif;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        body {
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #4A1F14, #8B3A0F, #D06900, #F57C00, #FF9A3C, #D06900);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(230, 205, 170, 0.2) 0%, transparent 70%);
            bottom: -120px;
            right: 5%;
            border-radius: 50%;
            pointer-events: none;
            animation: floatOrb1 9s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(255, 180, 80, 0.18) 0%, transparent 70%);
            top: -60px;
            left: 10%;
            border-radius: 50%;
            pointer-events: none;
            animation: floatOrb2 11s ease-in-out infinite;
        }

        @keyframes floatOrb1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(35px, -40px) scale(1.1);
            }
        }

        @keyframes floatOrb2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-30px, 35px) scale(1.08);
            }
        }

        .back-link {
            position: fixed;
            top: 28px;
            left: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.85);
            font-family: var(--font);
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            transition: color 0.2s;
            z-index: 10;
        }

        .back-link:hover {
            color: #fff;
        }

        .back-link svg {
            width: 18px;
            height: 18px;
        }

        .auth-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            width: 100%;
            max-width: 460px;
            padding: 80px 24px 24px;
        }

        .auth-brand img {
            height: 56px;
            width: auto;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
        }

        .auth-card {
            background: var(--white);
            border-radius: 28px;
            padding: 40px 36px 36px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(74, 31, 20, 0.35);
        }

        .card-heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .card-heading h1 {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--dark);
            margin-bottom: 6px;
        }

        .card-heading p {
            font-size: 0.9rem;
            color: var(--text-light);
            font-weight: 600;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .form-control-wrap {
            position: relative;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-family: var(--font);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--dark);
            background: #FAFAFA;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control::placeholder {
            color: #C5BAB5;
            font-weight: 600;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(245, 124, 0, 0.12);
            background: #fff;
        }

        .form-control.error {
            border-color: #EF5350;
        }

        .error-msg {
            font-size: 0.78rem;
            color: #EF5350;
            font-weight: 700;
            margin-top: 4px;
            display: none;
        }

        .form-control.error+.error-msg,
        .form-control-wrap.error-wrap .error-msg {
            display: block;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        /* Terms checkbox */
        .terms-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 24px;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 14px;
            background: #FAFAFA;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .terms-row:hover {
            border-color: var(--primary);
        }

        .terms-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            margin-top: 2px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .terms-text {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-light);
            line-height: 1.4;
        }

        .terms-text a {
            color: var(--primary);
            font-weight: 900;
            text-decoration: none;
        }

        .terms-text a:hover {
            text-decoration: underline;
        }

        .btn-signup {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-family: var(--font);
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 5px 0 var(--primary-dark);
        }

        .btn-signup:hover {
            background: #E56F00;
        }

        .btn-signup:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-signup:disabled {
            background: #EAEAEA;
            box-shadow: 0 5px 0 #D0CFCF;
            color: #B0A9A5;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1.5px;
            background: var(--border);
        }

        .divider span {
            font-size: 0.8rem;
            font-weight: 800;
            color: #C5BAB5;
            white-space: nowrap;
        }

        .btn-google {
            width: 100%;
            padding: 14px 16px;
            background: var(--white);
            color: var(--dark);
            border: 2px solid var(--border);
            border-radius: 14px;
            font-family: var(--font);
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: border-color 0.2s, background 0.2s;
            box-shadow: 0 4px 0 var(--border);
        }

        .btn-google:hover {
            border-color: #D5D0CB;
            background: #FAFAFA;
        }

        .btn-google:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .card-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .card-footer a {
            color: var(--primary);
            font-weight: 900;
            text-decoration: none;
        }

        .card-footer a:hover {
            opacity: 0.75;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .auth-card {
                padding: 32px 20px 28px;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
        </svg>
        Página Inicial
    </a>

    <div class="auth-wrapper">
        <div class="auth-brand">
            <img src="assets/logo.png" alt="UTOME Logo"
                onerror="this.src='https://img.icons8.com/color/64/robot-2.png'">
        </div>

        <div class="auth-card">
            <div class="card-heading">
                <h1>Criar sua conta</h1>
                <p>Comece a acompanhar as rotinas do seu filho</p>
            </div>

            <form id="signup-form" novalidate>
                <!-- Nome e Sobrenome -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">Nome</label>
                        <input type="text" id="first-name" class="form-control" placeholder="Ex: Maria" required>
                    </div>
                    <div class="form-group">
                        <label for="last-name">Sobrenome</label>
                        <input type="text" id="last-name" class="form-control" placeholder="Ex: Silva" required>
                    </div>
                </div>

                <!-- E-mail -->
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" class="form-control" placeholder="seu@email.com" autocomplete="email"
                        required>
                </div>

                <!-- Senha -->
                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="form-control-wrap">
                        <input type="password" id="password" class="form-control" placeholder="Mínimo 8 caracteres"
                            autocomplete="new-password" required style="padding-right: 48px;">
                        <button type="button" class="toggle-password" onclick="togglePassword('password','eye1')"
                            aria-label="Mostrar senha">
                            <svg id="eye1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Confirmar Senha -->
                <div class="form-group">
                    <label for="confirm-password">Confirmar Senha</label>
                    <div class="form-control-wrap">
                        <input type="password" id="confirm-password" class="form-control" placeholder="Repita a senha"
                            autocomplete="new-password" required style="padding-right: 48px;">
                        <button type="button" class="toggle-password"
                            onclick="togglePassword('confirm-password','eye2')" aria-label="Mostrar senha">
                            <svg id="eye2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Termos -->
                <label class="terms-row" for="agree-terms">
                    <input type="checkbox" id="agree-terms" onchange="validateForm()">
                    <span class="terms-text">
                        Eu li e concordo com os <a href="termos.html">Termos de Uso</a> e a <a
                            href="privacidade.html">Política de Privacidade</a>. Entendo que o UTOME é uma ferramenta de
                        apoio e não substitui tratamento médico.
                    </span>
                </label>

                <!-- Botão -->
                <button type="submit" class="btn-signup" id="btn-signup" disabled>Criar Minha Conta</button>
            </form>

            <div class="divider"><span>ou continue com</span></div>

            <button class="btn-google" id="btn-google">
                <img src="https://img.icons8.com/fluency/20/google-logo.png" alt="Google">
                Cadastrar com Google
            </button>

            <div class="card-footer">
                Já tem conta? <a href="login.html">Fazer login</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
            } else {
                input.type = 'password';
                icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
            }
        }

        function validateForm() {
            const agreed = document.getElementById('agree-terms').checked;
            document.getElementById('btn-signup').disabled = !agreed;
        }

        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const pw = document.getElementById('password').value;
            const cpw = document.getElementById('confirm-password').value;
            if (pw !== cpw) {
                document.getElementById('confirm-password').classList.add('error');
                alert('As senhas não coincidem!');
                return;
            }
            // TODO: Firebase Auth – createUserWithEmailAndPassword
            alert('Conta criada! Firebase será integrado na próxima etapa.');
        });

        document.getElementById('btn-google').addEventListener('click', () => {
            // TODO: Firebase Auth – Google Sign-In
            alert('Cadastro com Google em breve!');
        });
    </script>
</body>

</html>
